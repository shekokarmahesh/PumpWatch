name: Replay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PUMPWATCH_MODE: replay
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check --config backend/pyproject.toml backend scripts
      - run: python -m app.cli openapi
      - run: git diff --exit-code -- frontend/openapi.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend generate-api
      - run: git diff --exit-code -- frontend/src/api/schema.d.ts
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
