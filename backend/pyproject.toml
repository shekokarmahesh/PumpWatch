[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpwatch"
version = "0.1.0"
description = "Explainable public-attention research for Indian stocks"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.142,<1", "uvicorn>=0.54,<1", "sqlmodel>=0.0.48,<0.1", "rapidfuzz>=3.14,<4", "serpapi>=1.1,<2", "typer>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
pumpwatch = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
